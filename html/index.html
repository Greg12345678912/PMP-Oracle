<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pretty Much Picks</title>
  <meta name="description" content="Fantasy Football content, tier lists, and rankings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* Brand */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      object-fit: cover;
    }

    .brand-label {
      text-align: center;
    }

    .brand-name {
      color: #E10600;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .brand-sub {
      color: #6b6b6b;
      font-size: 13px;
      margin-top: 2px;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
    }

    .link-card:hover { background: #161616; }
    .link-card.youtube:hover  { border-color: #FF0000; }
    .link-card.youtube:hover  .link-icon { color: #FF0000; }
    .link-card.instagram:hover { border-color: #E1306C; }
    .link-card.instagram:hover .link-icon { color: #E1306C; }
    .link-card.tiktok:hover   { border-color: #ffffff; }
    .link-card.tiktok:hover   .link-icon { color: #ffffff; }
    .link-card.tier:hover     { border-color: #E10600; }
    .link-card.tier:hover     .link-name { color: #E10600; }
    .link-card.tier:hover     .chevron { color: #E10600; }

    .link-icon {
      color: #555;
      flex-shrink: 0;
      transition: color 0.2s;
      display: flex;
    }

    .link-icon svg { width: 22px; height: 22px; }

    .link-text { flex: 1; }

    .link-name {
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .link-desc {
      font-size: 11px;
      color: #555;
      margin-top: 1px;
    }

    .chevron {
      color: #333;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .chevron svg { width: 16px; height: 16px; }

    /* Tier card */
    .tier-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: #1e1e1e;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Brand -->
    <div class="brand">
      <img src="ChatGPT Image Jul 21, 2026, 03_22_39 PM.png" alt="Pretty Much Picks" class="logo" />
      <div class="brand-label">
        <p class="brand-name">Pretty Much Picks</p>
        <p class="brand-sub">Fantasy Football</p>
      </div>
    </div>

        </span>

          <div class="link-name">TikTok</div>
        </div>
        <span class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </span>
      </a>

    </div>

    <div class="divider"></div>

    <!-- Tier List Builder -->
    <div class="links">
      <a href="https://pretty-much-picks.vercel.app" target="_blank" rel="noopener noreferrer" class="link-card tier">
        <img src="ChatGPT Image Jul 24, 2026, 06_31_23 PM.png" alt="Tier List Builder" class="tier-logo" />
        <div class="link-text">
          <div class="link-name">Tier List Builder</div>
          <div class="link-desc">Build &amp; share your fantasy rankings</div>
        </div>
        <span class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </span>
      </a>
    </div>

  </div>
</body>
</html>
